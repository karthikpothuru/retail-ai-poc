spring.application.name=retail-inventory-mcp
server.port=8080

# Spring AI MCP server over Streamable HTTP
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=retail-inventory-mcp
spring.ai.mcp.server.version=1.0.0

# Helpful while learning; reduce verbosity later
logging.level.org.springframework.ai.mcp=INFO
