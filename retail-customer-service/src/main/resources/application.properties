spring.application.name=retail-customer-service
server.port=8081
spring.datasource.url=${RETAIL_DB_URL:jdbc:postgresql://127.0.0.1:5432/retail_customer}
spring.datasource.username=${RETAIL_DB_USER}
spring.datasource.password=${RETAIL_DB_PASSWORD}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
